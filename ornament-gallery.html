<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星のワンポイント 一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  /* ornament.html を実際の埋め込みと同じ iframe で並べる。背景は Notion の色を再現 */
  :root { color-scheme: dark; --bg: #191919; --ink: #e6e6e6; --mute: #8e8e93; --line: #2c2c2c; --btn: #ffffff24; }
  :root[data-theme="light"] { color-scheme: light; --bg: #ffffff; --ink: #37352f; --mute: #787774; --line: #e9e9e7; --btn: #37352f30; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; padding-inline: 16px; padding-block: 40px 64px; }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 36px; }
  header { display: grid; gap: 8px; }
  h1 { margin: 0; font: 400 clamp(26px, 5vw, 34px)/1.2 Marcellus, "Zen Kaku Gothic New", serif; letter-spacing: .04em; }
  header p { margin: 0; color: var(--mute); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: 500 13px/1 "Zen Kaku Gothic New", sans-serif; color: var(--ink); background: transparent; border: 1px solid var(--btn); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .item { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
  .item h2 { margin: 0; font: 400 19px/1.3 Marcellus, "Zen Kaku Gothic New", serif; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .item h2 code { font: 12px ui-monospace, Consolas, monospace; color: var(--mute); }
  .item p { margin: 0; color: var(--mute); font-size: 14px; }
  iframe { border: 0; display: block; width: 100%; background: transparent; }
  .sq iframe { width: 180px; height: 180px; margin-inline: auto; }
  .tall iframe { width: 120px; height: 360px; margin-inline: auto; }
  .url { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .url code { font: 12.5px ui-monospace, Consolas, monospace; color: var(--ink); overflow-wrap: anywhere; user-select: all; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>星のワンポイント</h1>
    <p>ornament.html の7種類を、Notionに埋め込んだときと同じ形で並べています。URLをコピーして、Notionの「埋め込み」ブロックに貼ってください。</p>
    <div class="bar">
      <button type="button" id="theme">ライトモードで見る</button>
    </div>
  </header>
  <div id="list" class="wrap" style="gap:28px"></div>
</div>
<script>
(() => {
  const BASE = 'https://usa7se.github.io/orbit-clock/ornament.html';
  const items = [
    ['01', 'phase', '満ち欠けの線', '今日の月齢にいちばん近い月が光る区切り線。', 'line', 64],
    ['02', 'mirror', '水鏡の線', '星が1分かけて渡り、毎秒波紋が広がる区切り線。', 'line', 80],
    ['03', 'meteor', '流れ星の線', '中央の✦が呼吸し、6秒おきに流れ星。', 'line', 64],
    ['04', 'constellation', '星座の線', '15秒ごとに新しい星座を結ぶ区切り線。', 'line', 72],
    ['06', 'moonmirror', '水鏡の月', '今日の形の月と、水面の光の道。', 'sq'],
    ['07', 'starclock', '小さな星の水鏡', '時刻つき。星が1分で昇って沈む。', 'sq'],
    ['14', 'hanging', '吊るし星', '縦長（幅:高さ＝1:3）のモビール。', 'tall']
  ];
  let theme = 'dark';
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    for (const [no, w, name, desc, kind, hgt] of items) {
      const url = `${BASE}?w=${w}`, el = document.createElement('div');
      el.className = 'item ' + kind;
      el.innerHTML = `<h2><code>${no}</code>${name}</h2><p>${desc}</p>`
        + `<iframe title="${name}" loading="lazy" src="ornament.html?w=${w}&theme=${theme}" ${kind === 'line' ? `style="height:${hgt}px"` : ''}></iframe>`
        + `<div class="url"><code>${url}</code><button type="button">URLをコピー</button></div>`;
      el.querySelector('button').addEventListener('click', e => {
        const b = e.currentTarget;
        navigator.clipboard.writeText(url).then(() => { b.textContent = 'コピーしました'; setTimeout(() => b.textContent = 'URLをコピー', 1500); },
          () => { const r = document.createRange(); r.selectNodeContents(el.querySelector('code')); getSelection().removeAllRanges(); getSelection().addRange(r); });
      });
      list.appendChild(el);
    }
  }
  document.getElementById('theme').addEventListener('click', e => {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    e.currentTarget.textContent = theme === 'dark' ? 'ライトモードで見る' : 'ダークモードで見る';
    render();
  });
  render();
})();
</script>
</body>
</html>
