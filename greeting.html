<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- index.html と同じく、埋め込み先と color-scheme を合わせて iframe の背景を透過のまま保つ -->
<meta name="color-scheme" content="light dark">
<script>
  (() => {
    const t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.querySelector('meta[name="color-scheme"]').content = t;
  })();
</script>
<title>水鏡のごあいさつ</title>
<!--
  水鏡のごあいさつ — ページ冒頭の挨拶文とリンクを、水鏡の夜空にまとめた埋め込み（星のワンポイントの姉妹品）

  ?x=アカウント名   X（Twitter）へのリンク先。例：?x=usa7se → https://x.com/usa7se
  &label=文字       リンクの表示（省略時は「Twitter」）
  &text=文章        挨拶文を差し替える。| で改行。省略時は下の DEFAULT_TEXT
  &theme=dark / &theme=light で配色を固定（省略時は見る人の端末の設定に合わせる）

  埋め込みの目安：横いっぱい × 高さ200px くらい。枠が狭いと文字が自動で小さくなって収まる。
  軽さのために：毎秒30コマまで、画面の外にある間とタブが裏にある間は描かない。
-->
<style>
  :root { --ink: 255, 255, 255; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --ink: 55, 53, 47; } }
  :root[data-theme="light"] { --ink: 55, 53, 47; }
  html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
  body {
    position: relative; display: grid; place-items: center;
    /* Notion の本文と同じ系統の書体にそろえる（読み込み不要で軽い） */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    color: rgba(var(--ink), .92);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; display: grid; justify-items: center; text-align: center; padding: 10px 16px; font-size: var(--fs, 15px); }
  .msg { margin: 0; line-height: 1.95; letter-spacing: .06em; text-wrap: balance; }
  .msg span { display: inline-block; }
  .water { height: 4.1em; display: grid; place-items: end center; }
  a.link {
    display: inline-flex; align-items: center; gap: .55em;
    font-size: .8em; letter-spacing: .08em; text-decoration: none; color: rgba(var(--ink), .85);
    padding: .45em 1.1em; border-radius: 999px; border: 1px solid rgba(var(--ink), .22);
    background: rgba(var(--ink), .03); transition: border-color .3s, color .3s, background .3s;
  }
  a.link:hover { border-color: rgba(var(--ink), .55); color: rgba(var(--ink), 1); background: rgba(var(--ink), .07); }
  a.link:focus-visible { outline: 2px solid rgba(var(--ink), .8); outline-offset: 3px; }
  a.link svg { width: 1em; height: 1em; fill: currentColor; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <p class="msg" id="msg"></p>
  <div class="water">
    <a class="link" id="link" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.2 8.2L23.3 22h-6.6l-5.2-6.8L5.5 22H2.4l7.7-8.8L1.9 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.8L7.4 3.9H5.5L17.7 20Z"/></svg>
      <span id="label"></span>
    </a>
  </div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const DEFAULT_TEXT = 'ご依頼をお引き受けしております。|一つ一つ真剣に取り組みをさせて頂きます、|どうぞ宜しくお願い致します。';
  const fixedTheme = ['dark', 'light'].includes(params.get('theme')) ? params.get('theme') : null;
  if (fixedTheme) document.documentElement.dataset.theme = fixedTheme;
  const prefersLight = matchMedia('(prefers-color-scheme: light)');
  const isLight = () => fixedTheme ? fixedTheme === 'light' : prefersLight.matches;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 文章とリンク。改行は「|」。行は途中で折り返さないよう span にまとめ、狭いときは行ごと次の段へ送る
  const msg = document.getElementById('msg');
  (params.get('text') || DEFAULT_TEXT).split('|').forEach(s => { const sp = document.createElement('span'); sp.textContent = s; msg.appendChild(sp); });
  const handle = (params.get('x') || '').replace(/^@/, '').replace(/[^A-Za-z0-9_]/g, '');
  const link = document.getElementById('link');
  document.getElementById('label').textContent = params.get('label') || 'Twitter';
  if (handle) link.href = 'https://x.com/' + handle; else link.removeAttribute('href');

  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  let INK = '255,255,255', GLOW = 1;
  const L = a => `rgba(${INK},${Math.max(0, Math.min(1, a))})`;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
  function rng(seed) { seed = (Math.abs(Math.floor(seed)) % 2147483646) + 1; return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function dot(x, y, r, a) { ctx.fillStyle = L(a); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function line(x1, y1, x2, y2, a, w = 1) { ctx.strokeStyle = L(a); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function glow(x, y, r, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, L(a * GLOW)); g.addColorStop(1, L(0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  function sparkle(x, y, len, a) {
    glow(x, y, len * 1.3, .45 * a);
    line(x - len, y, x + len, y, .8 * a, .7); line(x, y - len, x, y + len, .8 * a, .7);
    dot(x, y, 1.3, a);
  }
  const STARS = (() => { const r = rng(2024); return Array.from({ length: 90 }, () => ({ x: r(), y: r(), z: .3 + r() * .7, ph: r() * TAU })); })();

  // 枠に収まるまで文字を小さくする（スマホなど幅が狭いとき用）
  function fit() {
    let fs = Math.min(15, Math.max(11, innerWidth / 34));
    const main = document.querySelector('main');
    for (; fs > 9; fs -= .5) { main.style.setProperty('--fs', fs + 'px'); if (main.offsetHeight <= innerHeight - 4) break; }
  }

  // 水平線は文章のすぐ下。文章の位置から毎回計算する
  let vw = 0, vh = 0, dpr = 1, lay = null;
  function size() {
    fit();
    dpr = Math.min(devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    const m = msg.getBoundingClientRect(), a = link.getBoundingClientRect(), fs = parseFloat(getComputedStyle(document.querySelector('main')).fontSize);
    lay = { hz: Math.round(m.bottom + fs * 1.55) + .5, text: m, link: a, fs };
  }

  function draw(t, now) {
    const w = vw, h = vh, { hz, text } = lay, lineW = Math.min(w, Math.max(text.width + 160, w * .8)), x0 = (w - lineW) / 2;
    const edge = x => clamp01(Math.min(x - x0, x0 + lineW - x) / (lineW * .16));
    // 水平線（両端が消える）
    const g = ctx.createLinearGradient(x0, 0, x0 + lineW, 0);
    g.addColorStop(0, L(0)); g.addColorStop(.2, L(.5)); g.addColorStop(.8, L(.5)); g.addColorStop(1, L(0));
    ctx.strokeStyle = g; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, hz); ctx.lineTo(x0 + lineW, hz); ctx.stroke();
    // 空の星と、その映り込み。文章の上では星を薄くして読みやすさを守る
    for (const s of STARS) {
      const x = x0 + s.x * lineW, y = 4 + s.y * (hz - 10), e = edge(x);
      const under = x > text.left - 8 && x < text.right + 8 && y > text.top - 4 && y < text.bottom + 4 ? .25 : 1;
      const tw = .5 + .5 * Math.sin(t * 1.3 * s.z + s.ph);
      dot(x, y, .5 + .4 * s.z, (.12 + .35 * tw) * s.z * e * under);
      const ry = hz + (hz - y) * .45; if (ry > h - 2) continue;
      const wob = Math.sin(t * 2 + s.ph + ry * .4) * 1.2;
      line(x - 1.3 + wob, ry, x + 1.3 + wob, ry, .12 * s.z * e, .8);
    }
    // 明るい星：1分かけて、文章と水平線の間の低い空を左から右へ渡る（文章には重ならない）
    const sec = now.getSeconds() + now.getMilliseconds() / 1000, p = now.getMilliseconds() / 1000, th = sec / 60 * Math.PI;
    const sx = x0 + lineW * (.1 + .8 * sec / 60), arc = Math.max(5, Math.min(20, hz - text.bottom - 7));
    const sy = hz - arc * Math.sin(th), lift = clamp01(Math.sin(th) * 4) * edge(sx);
    sparkle(sx, sy, 4 + 1.5 * lift, .3 + .6 * lift);
    const my = hz + (hz - sy) * .9;
    for (let row = 0; row < 5; row++) {
      const y = hz + 3 + row * ((my - hz) / 4 + .3), len = (2 + row * .7) * (.6 + .4 * Math.sin(t * 3 + row * 1.7)), off = Math.sin(t * 2.3 + row * 2.1) * (1 + row * .4);
      line(sx + off - len, y, sx + off + len, y, (.45 - row * .06) * lift, .9);
    }
    // 毎秒、映った星の足もとに波紋
    const q = easeOut(p), rx = 2 + 22 * q;
    ctx.strokeStyle = L(.55 * (1 - q) * lift); ctx.lineWidth = .8; ctx.beginPath(); ctx.ellipse(sx, my, rx, rx * .22, 0, 0, TAU); ctx.stroke();
    // リンクのまわりの水面にも、ゆっくり広がる輪
    const lk = lay.link, lx = (lk.left + lk.right) / 2, ly = lk.bottom + 2, u = (t % 5) / 5;
    ctx.strokeStyle = L(.22 * (1 - u)); ctx.beginPath(); ctx.ellipse(lx, ly, lk.width / 2 + 8 + 40 * easeOut(u), 3 + 5 * easeOut(u), 0, 0, TAU); ctx.stroke();
  }

  let visible = true, running = false, last = 0, tSim = 0;
  function frame(ts) {
    running = false;
    if (!visible || document.hidden) return;
    if (ts - last >= 32 || reduce) {
      last = ts;
      const light = isLight(); INK = light ? '55,53,47' : '255,255,255'; GLOW = light ? .5 : 1;
      tSim = reduce ? tSim + 1 : ts / 1000;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw(tSim, new Date());
    }
    schedule();
  }
  function schedule() {
    if (running || !visible || document.hidden) return;
    running = true;
    reduce ? setTimeout(() => requestAnimationFrame(frame), 1000) : requestAnimationFrame(frame);
  }
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; schedule(); }).observe(canvas);
  document.addEventListener('visibilitychange', schedule);
  addEventListener('resize', () => { size(); schedule(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); schedule(); });
  size(); schedule();
})();
</script>
</body>
</html>
